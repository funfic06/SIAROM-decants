<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Composição editorial de perfume SIAROM</title>
  <desc id="desc">Uma composição abstrata em tons de carvão, âmbar e marfim com um frasco de perfume ao centro.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171614"/>
      <stop offset="0.58" stop-color="#30271f"/>
      <stop offset="1" stop-color="#5c3f28"/>
    </linearGradient>
    <radialGradient id="halo" cx="52%" cy="47%" r="55%">
      <stop offset="0" stop-color="#d4b77d" stop-opacity=".43"/>
      <stop offset=".48" stop-color="#9c6935" stop-opacity=".17"/>
      <stop offset="1" stop-color="#201f1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dfb0" stop-opacity=".95"/>
      <stop offset=".32" stop-color="#b17a3d" stop-opacity=".9"/>
      <stop offset=".72" stop-color="#694124" stop-opacity=".96"/>
      <stop offset="1" stop-color="#2d2119" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f2e6"/>
      <stop offset="1" stop-color="#ded1b9"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="24"/><feOffset dy="28"/><feComponentTransfer><feFuncA type="linear" slope=".46"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="850" cy="480" rx="630" ry="500" fill="url(#halo)"/>
  <circle cx="1170" cy="210" r="180" fill="#d8b879" opacity=".12" filter="url(#blur)"/>
  <circle cx="250" cy="760" r="220" fill="#7d4732" opacity=".17" filter="url(#blur)"/>
  <path d="M0 770 C320 660 440 840 720 750 S1160 620 1600 770 V1000 H0Z" fill="#151412" opacity=".62"/>
  <path d="M120 830 C370 710 510 850 790 800 S1240 710 1510 840" fill="none" stroke="#d4b77d" stroke-opacity=".22" stroke-width="2"/>
  <g filter="url(#shadow)" transform="translate(720 150)">
    <rect x="138" y="0" width="108" height="170" rx="9" fill="#171614" stroke="#d4b77d" stroke-opacity=".55" stroke-width="3"/>
    <rect x="151" y="18" width="82" height="130" rx="4" fill="#3b2d23" stroke="#c49a5b" stroke-opacity=".5"/>
    <rect x="115" y="142" width="155" height="78" rx="12" fill="#9c6935" stroke="#e8c982" stroke-opacity=".75" stroke-width="3"/>
    <rect x="56" y="196" width="272" height="495" rx="42" fill="url(#glass)" stroke="#e9ca8b" stroke-opacity=".82" stroke-width="4"/>
    <path d="M90 225 C160 250 218 244 294 215 V638 C220 676 150 680 90 642Z" fill="#e9c98d" opacity=".15"/>
    <rect x="91" y="388" width="202" height="164" rx="5" fill="url(#label)" opacity=".94"/>
    <path d="M112 423 H271" stroke="#3b2b21" stroke-opacity=".65" stroke-width="2"/>
    <text x="192" y="471" text-anchor="middle" fill="#3b2b21" font-family="Georgia, serif" font-size="28" letter-spacing="8">SIAROM</text>
    <text x="192" y="500" text-anchor="middle" fill="#8e663a" font-family="Arial, sans-serif" font-size="10" letter-spacing="4">RAFFINEMENT PARFUM</text>
    <path d="M123 608 H261" stroke="#f6e4bd" stroke-opacity=".5" stroke-width="2"/>
  </g>
  <g fill="#f2eee5" opacity=".55" font-family="Arial, sans-serif" letter-spacing="4">
    <text x="84" y="108" font-size="12">SIAROM / ARCHIVE Nº 01</text>
    <text x="1310" y="900" font-size="10">A FRAGRANCE BEGINS ON SKIN</text>
  </g>
  <rect x="42" y="42" width="1516" height="916" fill="none" stroke="#d4b77d" stroke-opacity=".22"/>
</svg>
